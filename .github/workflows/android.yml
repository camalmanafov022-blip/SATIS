name: Build Android WebView APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyanı çək
        uses: actions/checkout@v4

      - name: Java 17 Quraşdır
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Node.js 20 Quraşdır
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Capacitor ilə WebView Layihəsi Yarat
        run: |
          mkdir build-app
          cd build-app
          
          # Capacitor layihəsi başlat
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # Capacitor konfiqurasiyası
          npx cap init "Satış Proqramı" "com.satishproqrami.app" --web-dir www

          # Web fayllarını hazırlayırıq (WebView iframe)
          mkdir www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="az">
          <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>Satış Proqramı</title>
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  html, body { width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
                  iframe { width: 100%; height: 100%; border: none; display: block; }
              </style>
          </head>
          <body>
              <iframe src="https://ais-pre-l453wfmu45bvl6iqnnqkoh-673180996970.europe-west2.run.app"></iframe>
          </body>
          </html>
          EOF

          # Android platformasını əlavə et
          npx cap add android
          npx cap copy android

      - name: APK Yığ (Gradle)
        run: |
          cd build-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Faylını Saxla
        uses: actions/upload-artifact@v4
        with:
          name: satish-proqrami-apk
          path: build-app/android/app/build/outputs/apk/debug/app-debug.apk
          
